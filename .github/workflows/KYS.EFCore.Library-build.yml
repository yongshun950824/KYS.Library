name: CI - Build KYS.EFCore Library
permissions:
  contents: read
  pull-requests: read

on:
  workflow_dispatch: # Allows manual trigger
  push:
    branches:
      - master
    paths:
      - "src/KYS.EFCore.Library/**"
      - "src/KYS.Library/**"
      - "tests/KYS.EFCore.Library.Tests/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
  pull_request:
    branches:
      - master
    paths:
      - "src/KYS.EFCore.Library/**"
      - "src/KYS.Library/**"
      - "tests/KYS.EFCore.Library.Tests/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"

jobs:
  build:
    uses: ./.github/workflows/reusable-dotnet-build.yml
    with:
      library-name: "KYS.EFCore Library"
      library-project-path: "src/KYS.EFCore.Library/KYS.EFCore.Library.csproj"
      library-tests-project-path:
      dotnet-version: "10.0.x"
